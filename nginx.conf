server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  add_header Cache-Control "no-cache";

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reserved for Vite's content-hashed build output.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Missing static files must not fall back to the SPA document.
  location ~* /[^/]+\.[^/]+$ {
    try_files $uri =404;
  }
}
